<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение: Название манги - Глава 42</title>
    <style>
        /* Сохраняем ту же цветовую палитру */
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --accent-color: #FFDE00;
            --surface-bg: #f7f7f7;
            --border-color: #e0e0e0;
            --card-hover-shadow: #111111;
            --overlay-bg: rgba(0, 0, 0, 0.7);
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --accent-color: #FFD000;
            --surface-bg: #1e1e1e;
            --border-color: #333333;
            --card-hover-shadow: #FFD000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* --- ШАПКА --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: var(--surface-bg);
            border-bottom: 2px solid var(--border-color);
        }

        .back-link {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 800;
            font-size: 18px;
            text-transform: uppercase;
            border: 2px solid transparent;
            padding: 5px 10px;
            transition: all 0.2s;
        }

        .back-link:hover {
            border-color: var(--text-color);
            background-color: var(--accent-color);
            color: #111;
        }

        .chapter-title {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 20px;
        }

        /* --- КОНТЕЙНЕР ДЛЯ ЧТЕНИЯ --- */
        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Классы для режимов чтения */
        #reader-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .manga-page {
            width: 100%;
            background-color: var(--surface-bg);
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            opacity: 0.8;
            /* Пропорции страницы манги (заглушка вместо <img>) */
            aspect-ratio: 3/4; 
        }

        /* Скрываем страницы, кроме текущей, в горизонтальном режиме */
        .horizontal-mode .manga-page {
            display: none;
            margin-bottom: 0;
        }

        .horizontal-mode .manga-page.active {
            display: flex;
        }

        /* Кнопки перелистывания (прозрачные зоны по краям в горизонтальном режиме) */
        .nav-zone {
            display: none;
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            cursor: pointer;
            z-index: 10;
        }
        
        .horizontal-mode .nav-zone {
            display: block;
        }

        .nav-zone.prev { left: 0; }
        .nav-zone.next { right: 0; }
        
        /* Счетчик страниц */
        #page-counter {
            display: none;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        .horizontal-mode #page-counter {
            display: block;
        }

        /* --- КНОПКА НАСТРОЕК (ПЛАВАЮЩАЯ) --- */
        .settings-btn {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 50px;
            height: 50px;
            background-color: var(--accent-color);
            border: 2px solid #111;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 4px 4px 0px var(--card-hover-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 100;
        }

        body.dark-theme .settings-btn {
            border-color: #fff;
        }

        .settings-btn:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px var(--card-hover-shadow);
        }

        /* --- ОКНО НАСТРОЕК (МОДАЛЬНОЕ) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--overlay-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background-color: var(--bg-color);
            padding: 30px;
            border: 3px solid var(--text-color);
            border-radius: 8px;
            box-shadow: 8px 8px 0px var(--accent-color);
            width: 300px;
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 4px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .radio-group label {
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Стилизация радио-кнопок */
        input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-color);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
        }

        input[type="radio"]:checked::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .close-modal-btn {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-modal-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← Назад</a>
        <div class="chapter-title">Название манги - Глава 42</div>
        <div style="width: 80px;"></div> <!-- Пустой блок для центрирования заголовка -->
    </header>

    <main>
        <div id="page-counter">Страница <span id="current-page-num">1</span> из <span id="total-pages-num">5</span></div>
        
        <div id="reader-container" class="vertical-mode">
            <!-- Зоны клика для горизонтального режима -->
            <div class="nav-zone prev" id="nav-prev" title="Предыдущая страница"></div>
            <div class="nav-zone next" id="nav-next" title="Следующая страница"></div>

            <!-- Заглушки страниц (в реальном проекте тут будут теги <img>) -->
            <div class="manga-page active">Страница 1 (Картинка)</div>
            <div class="manga-page">Страница 2 (Картинка)</div>
            <div class="manga-page">Страница 3 (Картинка)</div>
            <div class="manga-page">Страница 4 (Картинка)</div>
            <div class="manga-page">Страница 5 (Картинка)</div>
        </div>
    </main>

    <!-- Плавающая кнопка настроек -->
    <button class="settings-btn" id="open-settings">⚙</button>

    <!-- Модальное окно настроек -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <h3>Настройки</h3>
            <div class="radio-group">
                <label>
                    <input type="radio" name="read-mode" value="vertical" checked>
                    Вертикально
                </label>
                <label>
                    <input type="radio" name="read-mode" value="horizontal">
                    Горизонтально
                </label>
            </div>
            
            <!-- Добавил переключатель темы сюда для удобства -->
            <div class="radio-group" style="border-top: 2px dashed var(--border-color); padding-top: 15px;">
                <label>
                    <input type="checkbox" id="theme-toggle-reader">
                    Тёмная тема
                </label>
            </div>

            <button class="close-modal-btn" id="close-settings">Закрыть</button>
        </div>
    </div>

    <script>
        // Элементы
        const readerContainer = document.getElementById('reader-container');
        const pages = document.querySelectorAll('.manga-page');
        const totalPages = pages.length;
        const currentPageNum = document.getElementById('current-page-num');
        const totalPagesNum = document.getElementById('total-pages-num');
        
        // Модальное окно
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings');
        const closeSettingsBtn = document.getElementById('close-settings');
        
        // Настройки
        const modeRadios = document.getElementsByName('read-mode');
        const themeCheckbox = document.getElementById('theme-toggle-reader');
        
        // Навигация горизонтальная
        const navPrev = document.getElementById('nav-prev');
        const navNext = document.getElementById('nav-next');

        let currentPageIndex = 0;
        let isHorizontal = false;

        totalPagesNum.textContent = totalPages;

        // Открытие / закрытие настроек
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        // Закрытие при клике вне окна
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        // Смена режима чтения
        modeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'horizontal') {
                    isHorizontal = true;
                    readerContainer.className = 'horizontal-mode';
                    updateHorizontalView();
                } else {
                    isHorizontal = false;
                    readerContainer.className = 'vertical-mode';
                }
            });
        });

        // Логика горизонтального перелистывания
        function updateHorizontalView() {
            pages.forEach((page, index) => {
                if (index === currentPageIndex) {
                    page.classList.add('active');
                } else {
                    page.classList.remove('active');
                }
            });
            currentPageNum.textContent = currentPageIndex + 1;
            window.scrollTo(0, 0); // Прокрутка наверх при смене страницы
        }

        navNext.addEventListener('click', () => {
            if (isHorizontal && currentPageIndex < totalPages - 1) {
                currentPageIndex++;
                updateHorizontalView();
            }
        });

        navPrev.addEventListener('click', () => {
            if (isHorizontal && currentPageIndex > 0) {
                currentPageIndex--;
                updateHorizontalView();
            }
        });

        // Переключение темы (синхронизировано с чекбоксом)
        themeCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        });
    </script>
</body>
</html>
