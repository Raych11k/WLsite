<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Читалка — WL</title>
    <link rel="icon" href="data/icon.png" type="image/png">
    <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('wl_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/wl.css">
    <link rel="stylesheet" href="styles/reader.css">

    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111944456', 'ym');

        ym(111944456, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/111944456" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
</head>
<body class="reader">

    <div class="rd-progress" aria-hidden="true"><i id="rd-progress-bar"></i></div>

    <header class="rd-top" id="rd-top">
        <a class="icon-btn rd-back" id="rd-back" href="main.html" aria-label="К тайтлу" title="К тайтлу"></a>
        <div class="rd-heading">
            <a class="rd-title" id="rd-title-name" href="main.html">WhiteLight</a>
            <div class="rd-chapter">
                <span class="rd-chapter-label" id="chapter-title">Загрузка...</span>
                <select id="rd-chapter-select" aria-label="Выбор главы" hidden></select>
            </div>
        </div>
        <div class="rd-top-actions">
            <button type="button" class="icon-btn" id="prev-chapter-btn" title="Предыдущая глава" aria-label="Предыдущая глава" disabled></button>
            <button type="button" class="icon-btn" id="next-chapter-btn" title="Следующая глава" aria-label="Следующая глава" disabled></button>
            <button type="button" class="icon-btn rd-hide-sm" id="rd-fullscreen" title="Полный экран (F)" aria-label="Полный экран"></button>
            <button type="button" class="icon-btn" id="open-settings" title="Настройки чтения (S)" aria-label="Настройки чтения"></button>
        </div>
    </header>

    <main id="reader-container" class="mode-vertical fit-width" tabindex="-1">
        <div id="pages-wrapper">
            <div class="rd-loading"><span class="spinner"></span>Загружаем главу…</div>
        </div>
        <section class="rd-end" id="rd-end" hidden></section>
    </main>

    <div class="rd-zones" aria-hidden="true">
        <div class="nav-zone prev" id="nav-prev"></div>
        <div class="nav-zone center" id="nav-center"></div>
        <div class="nav-zone next" id="nav-next"></div>
    </div>

    <footer class="rd-bottom" id="rd-bottom">
        <button type="button" class="icon-btn" id="page-prev" aria-label="Предыдущая страница"></button>
        <div class="rd-scrub">
            <input type="range" id="page-slider" min="1" max="1" value="1" aria-label="Страница">
        </div>
        <span class="rd-counter" id="page-counter">— / —</span>
        <button type="button" class="icon-btn" id="page-next" aria-label="Следующая страница"></button>
    </footer>

    <div class="rd-sheet-overlay" id="settings-modal" hidden>
        <aside class="rd-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="rd-sheet-head">
                <h2 id="settings-title">Настройки чтения</h2>
                <button type="button" class="icon-btn" id="close-settings-x" aria-label="Закрыть"></button>
            </div>

            <div class="rd-sheet-body">
                <fieldset class="rd-opt">
                    <legend>Режим чтения</legend>
                    <div class="rd-choice">
                        <label><input type="radio" name="read-mode" value="vertical" checked><span data-icon="rows">Вертикально</span></label>
                        <label><input type="radio" name="read-mode" value="horizontal"><span data-icon="columns">Горизонтально</span></label>
                    </div>
                </fieldset>

                <fieldset class="rd-opt">
                    <legend>Вид изображения</legend>
                    <div class="rd-choice">
                        <label><input type="radio" name="fit-mode" value="width" checked><span>По ширине экрана</span></label>
                        <label><input type="radio" name="fit-mode" value="height"><span>По высоте экрана</span></label>
                    </div>
                </fieldset>

                <div class="rd-opt" data-show-fit="width">
                    <div class="rd-opt-row">
                        <label for="opt-width">Ширина страниц</label>
                        <output id="opt-width-out">900 px</output>
                    </div>
                    <input type="range" id="opt-width" min="480" max="1600" step="20" value="900">
                </div>

                <fieldset class="rd-opt" data-show-mode="vertical">
                    <legend>Отступ между страницами</legend>
                    <div class="rd-choice rd-choice-3">
                        <label><input type="radio" name="gap" value="0"><span>Нет</span></label>
                        <label><input type="radio" name="gap" value="10"><span>Малый</span></label>
                        <label><input type="radio" name="gap" value="28"><span>Большой</span></label>
                    </div>
                </fieldset>

                <fieldset class="rd-opt" data-show-mode="horizontal">
                    <legend>Направление листания</legend>
                    <div class="rd-choice">
                        <label><input type="radio" name="dir" value="ltr"><span>Слева направо</span></label>
                        <label><input type="radio" name="dir" value="rtl"><span>Справа налево</span></label>
                    </div>
                </fieldset>

                <fieldset class="rd-opt">
                    <legend>Фон</legend>
                    <div class="rd-choice rd-choice-3 rd-bg-choice">
                        <label><input type="radio" name="bg" value="black"><span><i style="background:#000"></i>Чёрный</span></label>
                        <label><input type="radio" name="bg" value="ink"><span><i style="background:#18181d"></i>Графит</span></label>
                        <label><input type="radio" name="bg" value="paper"><span><i style="background:#efe9dd"></i>Бумага</span></label>
                    </div>
                </fieldset>

                <div class="rd-opt rd-switches">
                    <label class="rd-switch"><span>Номера на страницах</span><input type="checkbox" id="opt-numbers"><i></i></label>
                    <label class="rd-switch"><span>Прятать панели при чтении</span><input type="checkbox" id="opt-autohide"><i></i></label>
                </div>

                <div class="rd-opt rd-keys">
                    <p class="rd-keys-title">Горячие клавиши</p>
                    <div><span><kbd>←</kbd> <kbd>→</kbd> или <kbd>A</kbd> <kbd>D</kbd></span><span>страницы</span></div>
                    <div><span><kbd>[</kbd> <kbd>]</kbd></span><span>главы</span></div>
                    <div><span><kbd>F</kbd></span><span>полный экран</span></div>
                    <div><span><kbd>H</kbd></span><span>скрыть панели</span></div>
                    <div><span><kbd>S</kbd></span><span>настройки</span></div>
                </div>
            </div>

            <button type="button" class="btn btn-gold rd-sheet-done" id="close-settings">Готово</button>
        </aside>
    </div>

    <div class="rd-hint" id="rd-hint" hidden>
        <div class="rd-hint-zone"><span id="hint-left">Назад</span></div>
        <div class="rd-hint-zone center"><span>Меню</span></div>
        <div class="rd-hint-zone"><span id="hint-right">Вперёд</span></div>
    </div>

    <script src="scripts/core.js"></script>
    <script src="scripts/reader.js"></script>
</body>
</html>
